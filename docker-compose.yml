services:
  logiroute:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: /data/logiroute.db
    volumes:
      - logiroute-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  logiroute-data:
